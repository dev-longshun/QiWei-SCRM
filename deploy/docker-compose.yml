# 源雀SCRM 本地依赖服务：MySQL 8 + Redis
# 启动： docker compose -f deploy/docker-compose.yml up -d
# 停止： docker compose -f deploy/docker-compose.yml down
# 清库重来： docker compose -f deploy/docker-compose.yml down -v && ... up -d
services:
  mysql:
    image: mysql:8.0.36
    container_name: iyque-mysql
    restart: unless-stopped
    ports:
      - "10179:3306"          # 对应 application.yml 里的 jdbc 端口
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scrm_ky # 对应 application.yml 里的库名
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --max_allowed_packet=64M
    volumes:
      - iyque-mysql-data:/var/lib/mysql
      # 首次启动自动导入 52 张表（来自 configFile/scrm_push.zip）
      - ./sql/scrm_push.sql:/docker-entrypoint-initdb.d/01-scrm.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: iyque-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - iyque-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  iyque-mysql-data:
  iyque-redis-data:
