# 生产覆盖配置 —— 经 SPRING_CONFIG_ADDITIONAL_LOCATION 挂载，优先级高于 jar 内的 application.yml
# 敏感值全部来自环境变量（docker-compose 从 .env 注入），不落明文
server:
  port: 8085

iyque:
  userName: ${IYQUE_ADMIN_USER}
  pwd: ${IYQUE_ADMIN_PWD}
  demo: false
  uploadDir: /app/upload
  inquiryAll: true
  fileViewUrl: https://${DOMAIN}/iyque/file/fileView/
  complaintUrl: https://${DOMAIN}/openmobile/customerComplaint
  customerSeasUrl: https://${DOMAIN}/openmobile/customerSeas
  h5MarketUrl: https://${DOMAIN}/openmobile/H5Marketing?id={0}

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    show-sql: false          # 上游默认 true，生产会刷爆日志
    generate-ddl: false
    hibernate:
      ddl-auto: none
  redis:
    host: redis
    port: 6379
    database: 1

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl   # 上游默认往 stdout 打全部 SQL

logging:
  level:
    root: INFO
