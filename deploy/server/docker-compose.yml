# 源雀SCRM 生产栈 @ txyun-longjin (122.51.26.145，腾讯云上海 4C4G)
# 所有端口只绑 127.0.0.1，对外统一走 nginx
# 内存上限按本机 3.6 GiB 收紧：三者合计上限 2.15 GiB，给系统留约 1.4 GiB
# （香港实测三容器实际只占 610 MB，上限只是防跑飞）
services:
  mysql:
    image: mysql:8.0.36
    container_name: qiwei-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --max_allowed_packet=64M
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql/scrm_push.sql:/docker-entrypoint-initdb.d/01-scrm.sql:ro
    mem_limit: 800m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: qiwei-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./data/redis:/data
    mem_limit: 150m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  backend:
    image: eclipse-temurin:17-jre
    container_name: qiwei-backend
    restart: unless-stopped
    working_dir: /app
    # -Xmx768m：本机 3.6G，不能让 JVM 按默认吃掉物理内存的 1/4
    command: >
      java -Xms256m -Xmx768m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai
      -jar /app/app.jar
    environment:
      TZ: Asia/Shanghai
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
      IYQUE_JWT_SECRET: ${IYQUE_JWT_SECRET}
      IYQUE_ADMIN_USER: ${IYQUE_ADMIN_USER}
      IYQUE_ADMIN_PWD: ${IYQUE_ADMIN_PWD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DOMAIN: ${DOMAIN}
      PUBLIC_BASE: ${PUBLIC_BASE}
    volumes:
      - ./app/app.jar:/app/app.jar:ro
      - ./config:/app/config:ro
      - ./upload:/app/upload
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8085"
    mem_limit: 1200m
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
