# 源雀SCRM @ qiwei.longjinapi.com
# 静态资源放 /var/www/qiwei（nginx 跑 www-data，读不了 /root）
# 证书由 certbot --nginx 自动写入并续期

server {
    listen 80;
    listen [::]:80;
    server_name qiwei.longjinapi.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.22 用 listen 上的 http2 参数；独立的 "http2 on;" 是 1.25.1+ 才有
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qiwei.longjinapi.com;

    ssl_certificate     /etc/letsencrypt/live/qiwei.longjinapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qiwei.longjinapi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;
    client_body_buffer_size 20M;

    access_log /var/log/nginx/qiwei-access.log;
    error_log  /var/log/nginx/qiwei-error.log;

    # 后端 API：注意 proxy_pass 末尾斜杠会剥掉 /iyque 前缀
    # 企微回调实际打到 http://127.0.0.1:18085/iycallback/handle
    location ^~ /iyque/ {
        proxy_pass http://127.0.0.1:18085/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 企微回调要求 1 秒内响应，超时设短一点便于快速失败而不是挂住
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # PC 管理后台
    location /tools {
        root /var/www/qiwei;
        index index.html;
        try_files $uri $uri/ /tools/index.html;
    }

    # 移动端 / H5（企微侧边栏、投诉、客户公海、H5营销）
    location /openmobile {
        alias /var/www/qiwei/openmobile;
        index index.html;
        try_files $uri $uri/ /openmobile/index.html;
    }

    # 企微「网页授权及JS-SDK」域名归属校验文件（WW_verify_xxx.txt 放 /var/www/qiwei/）
    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/qiwei;
    }

    location = / { return 302 /tools/; }
}
