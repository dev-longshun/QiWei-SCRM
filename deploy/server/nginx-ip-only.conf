# 源雀SCRM —— 备案前的临时配置：仅 HTTP，用公网 IP 直接访问
# 备案通过后执行 certbot --nginx -d <域名>，会自动补上 443 与跳转，
# 那之后本文件可替换为 nginx-qiwei.conf（含完整 TLS 配置）。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;
    client_body_buffer_size 20M;

    access_log /var/log/nginx/qiwei-access.log;
    error_log  /var/log/nginx/qiwei-error.log;

    # 后端 API：末尾斜杠会剥掉 /iyque 前缀
    # 企微回调最终打到 http://127.0.0.1:18085/iycallback/handle
    location ^~ /iyque/ {
        proxy_pass http://127.0.0.1:18085/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /tools {
        root /var/www/qiwei;
        index index.html;
        try_files $uri $uri/ /tools/index.html;
    }

    location /openmobile {
        alias /var/www/qiwei/openmobile;
        index index.html;
        try_files $uri $uri/ /openmobile/index.html;
    }

    # 企微「网页授权及JS-SDK」域名归属校验文件
    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/qiwei;
    }

    location = / { return 302 /tools/; }
}
